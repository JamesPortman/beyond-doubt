<!--STYLE-->
<style>
  /* The article is the whole page here, so it starts at the top rather than below a
     board — and the rule that separated it from the game is gone with the game. */
  .how{margin-top:0;padding-top:0;border-top:0}
  .page-head{max-width:42rem;margin:0 auto;display:flex;align-items:center;
    justify-content:space-between;gap:16px;padding:22px 0 30px}
  .page-head a.back{color:var(--ink-soft);text-decoration:none;font-size:.9rem;
    border-bottom:1px solid var(--line);padding-bottom:2px}
  .page-head a.back:hover{color:var(--accent);border-bottom-color:var(--accent)}
  .page-foot{max-width:42rem;margin:56px auto 0;padding-top:26px;border-top:1px solid var(--line);
    display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem}
  .page-foot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
  .page-foot a:hover{color:var(--accent);border-bottom-color:var(--accent)}

  /* The layer diagram and the route table are the only two things this page needs that
     the game's stylesheet does not already carry. */
  .diagram{margin:26px 0 30px}
  .diagram svg{width:100%;height:auto;display:block}
  .diagram .lay{fill:var(--surface-alt);stroke:var(--line)}
  .diagram .lay.core{fill:var(--accent);stroke:var(--accent)}
  .diagram .lab{fill:var(--ink);font-weight:700;letter-spacing:.02em}
  .diagram .det{fill:var(--ink-soft);font-size:11.5px;font-family:var(--font-body)}
  .diagram .core-ink{fill:var(--bg)}
  .tech table.routes{width:100%;border-collapse:collapse;margin:22px 0 24px;font-size:.9rem}
  .tech table.routes th{text-align:left;font-family:var(--font-display);font-size:.7rem;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:0 12px 8px 0;
    border-bottom:1px solid var(--line)}
  .tech table.routes td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);
    vertical-align:top;line-height:1.45}
  .tech table.routes td:first-child{font-family:var(--font-mono);font-size:.84rem;
    color:var(--ink);white-space:nowrap}
  .tech table.routes td:last-child{color:var(--ink-soft)}
  .tech code{font-family:var(--font-mono);font-size:.88em;background:var(--surface-alt);
    border:1px solid var(--line);border-radius:3px;padding:1px 5px}
  /* a table cannot be allowed to push the page sideways on a phone */
  .tech .table-wrap{overflow-x:auto}
</style>
</head>

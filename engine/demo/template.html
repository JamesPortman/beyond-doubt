<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clues — a daily deduction puzzle</title>
  <meta name="description" content="A daily logic puzzle in seven settings and three languages. Every clue is true, and you are never asked to guess.">
  <meta name="theme-color" content="#f0e7d4">
  <meta property="og:title" content="Clues — a daily deduction puzzle">
  <meta property="og:description" content="Seven games, three languages, one rule: you are never asked to guess.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f0e7d4'/%3E%3Ccircle cx='11' cy='12' r='5' fill='%233f7a4f'/%3E%3Ccircle cx='21' cy='12' r='5' fill='%233f7a4f'/%3E%3Ccircle cx='11' cy='22' r='5' fill='%23d2601a'/%3E%3Ccircle cx='21' cy='22' r='5' fill='%233f7a4f'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  /* one type scale, driven by the root size, so the High-legibility setting
     enlarges the whole interface rather than just the body copy */
  html{font-size:calc(17px * var(--font-scale, 1))}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:1rem;
    min-height:100vh; -webkit-font-smoothing:antialiased;
    transition:background .35s ease, color .35s ease;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

  header{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  h1{font-family:var(--font-display);font-size:2.15rem;margin:0;letter-spacing:-.01em;line-height:1.1}
  #tagline{margin:5px 0 0;color:var(--ink-soft);font-size:.98rem;max-width:52ch}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select{
    background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);
    border-radius:5px;padding:8px 11px;font:inherit;font-size:.88rem;cursor:pointer
  }
  #modes{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}

  #inspectBtn.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}

  /* settings panel — label on the left, control on the right, one row each */
  .settings-card{text-align:left;max-width:430px;max-height:86vh;overflow:auto}
  .settings-card h2{text-align:left;margin-bottom:16px}
  .setting-rows{display:flex;flex-direction:column;gap:11px;margin-bottom:20px}
  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .setting-label{font-size:.94rem;color:var(--ink);flex:1;text-align:left;line-height:1.3}
  .setting-row select{min-width:168px;max-width:168px;font-size:.88rem}
  .setting-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

  /* inspect */
  #inspect .insp-clue{margin:0 0 13px;font-size:1rem;font-weight:600;line-height:1.4;
    padding-left:10px;border-left:2px solid var(--accent)}
  #inspect .insp-credit{margin:-9px 0 13px;padding-left:10px;font-size:.84rem;
    color:var(--ink-soft);font-style:italic}
  #inspect .insp-head{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-soft);margin:14px 0 6px;font-weight:700}
  #inspect .insp-body{margin:0;font-size:.94rem;line-height:1.55;color:var(--ink)}
  #inspect .term{margin:0 0 10px;font-size:.89rem;line-height:1.5}
  #inspect .term b{display:block;color:var(--accent);font-size:.86rem}
  #inspect .term span{color:var(--ink-soft)}
  #inspect button{margin-top:14px}
  .cell.dimmed{opacity:.28}
  .cell.no-art .cap{position:static;background:none;color:var(--tile-ink);
    height:100%;justify-content:center;align-items:center;text-align:center}

  #account{display:inline-flex;align-items:center;gap:7px;font-size:.86rem;color:var(--ink-soft);
    padding:6px 10px;border:1px solid var(--line);border-radius:4px}
  #account .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft)}
  #account .dot.up{background:var(--state-a);box-shadow:0 0 6px var(--state-a)}
  #account .who{color:var(--ink)}
  .link{border:0;padding:0 0 0 4px;color:var(--accent);text-decoration:underline;background:none;font-size:.86rem}
  .day.locked{opacity:.3;cursor:not-allowed}
  .field{display:block;width:100%;margin:0 0 8px;padding:9px 11px;border-radius:4px;
    border:1px solid var(--line);background:var(--surface-alt);color:var(--ink);font:inherit;font-size:14px}
  .result.signin{text-align:left;max-width:330px}
  .result.signin h2{text-align:center}
  .result.signin .big{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .tab,.chip,button{
    font:inherit;font-size:.88rem;cursor:pointer;border-radius:5px;
    border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;
    transition:background .15s,border-color .15s,transform .1s
  }
  .tab.on,.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
  button:active{transform:translateY(1px)}

  .layout{display:grid;grid-template-columns:minmax(300px,1fr) 340px;gap:26px;align-items:start}
  @media(max-width:880px){.layout{grid-template-columns:1fr}}

  #week{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .day{display:flex;flex-direction:column;gap:2px;align-items:center;padding:7px 11px;min-width:52px}
  .day-name{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase}
  .day-diff{font-size:8px;color:var(--ink-soft);letter-spacing:2px}
  .day.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .day.done{background:color-mix(in srgb, var(--state-a) 22%, transparent)}

  .stat-note{display:block;font-size:.62rem;white-space:nowrap;letter-spacing:.02em;color:var(--ink-soft);opacity:.8;margin-top:1px}
  .chip.s0.on{background:var(--state-a);border-color:var(--state-a)}
  .chip.s1.on{background:var(--state-b);border-color:var(--state-b)}

  #board{display:grid;gap:9px;margin-bottom:16px;max-width:580px}
  /* square tiles, artwork edge to edge, caption bar across the foot */
  .cell{
    aspect-ratio:1;display:block;padding:0;background:var(--tile);color:var(--tile-ink);
    container-type:size;
    border:1px solid var(--tile-line);border-radius:4px;
    text-align:left;position:relative;overflow:hidden;
    transition:transform var(--motion,.15s), box-shadow var(--motion,.2s), opacity var(--motion,.2s), filter var(--motion,.2s)
  }
  .cell:hover{transform:translateY(-2px)}
  .art{position:absolute;inset:0;display:block}
  .art .tile-art{width:100%;height:100%;display:block}
  /* real artwork fills the tile the same way the drawing does */
  .tile-photo{position:absolute;inset:0;display:block;background:var(--tile)}
  .tile-photo img{width:100%;height:100%;object-fit:cover;display:block;user-select:none}
  .tile-photo .tile-overlay{position:absolute;inset:0}
  /* The caption is a fixed 20% of the tile, so the picture always gets the other 80%
     and every tile on the board has its label on the same line. Type is sized in cqh —
     a share of the tile's own height — so it scales with the board instead of being
     right at one width and wrong at every other. */
  .cap{
    position:absolute;left:0;right:0;bottom:0;height:25cqh;
    display:flex;flex-direction:column;justify-content:center;gap:0;overflow:hidden;
    padding:0 6cqw;background:var(--tile-ink);
    color:var(--tile)
  }
  /* The person is the subject of the tile, so the person is what shouts. The role is
     supporting information and now reads as ordinary words rather than a label. */
  .cell-name{font-size:13cqh;font-weight:800;line-height:1.1;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:var(--font-body);text-shadow:0 1px 2px rgba(0,0,0,.45)}
  body:not([data-label-mode="title"]):not([data-label-mode="artwork"]) .cell-name{text-transform:uppercase}
  .cell-tag{display:block;font-size:8cqh;letter-spacing:.005em;text-transform:none;opacity:.78;
    font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.5cqh}
  .cell-tag::first-letter{text-transform:uppercase}
  body[data-label-mode="artwork"] .cell-name{
    font-size:12cqh;letter-spacing:-.01em;text-shadow:none}
  body[data-label-mode="artwork"] .cell-tag{font-size:7.6cqh;opacity:.7}
  /* Over a photograph a translucent caption is unreadable, and a gallery does not print
     its labels on the painting anyway: this is the card under the picture. */
  body[data-label-mode="artwork"] .cap{
    padding:0 4cqw;background:var(--tile-ink);backdrop-filter:none}
  .cell-state{
    position:absolute;top:7px;right:var(--tag-right,7px);left:var(--tag-left,auto);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:3px;background:var(--tile-ink);color:var(--tile);font-weight:700
  }
  /* A decidable square used to be flagged by a 6px dot in the corner, which is a lot to
     ask of a player scanning twenty tiles on a phone. The whole square lights instead:
     an accent ring, and the label plate takes the accent so it reads at arm's length. */
  /* The ring is drawn in --ink rather than --accent because every palette guarantees
     ink reads against its own background, and one theme (The Wall) already frames each
     tile in something very close to its accent — an accent ring vanished there. */
  .cell.forced{
    outline:3px solid var(--ink);outline-offset:1px;
    box-shadow:0 0 18px var(--glow, transparent), 0 4px 12px rgba(0,0,0,.24)
  }
  /* The wash goes over the picture, not the label. Tinting the label plate with the
     accent looked stronger but put pale text on gold in half the themes; the picture
     can take a colour cast, the words cannot. */
  .cell.forced::before{
    content:"";position:absolute;left:0;right:0;top:0;bottom:25cqh;
    background:var(--accent);opacity:.28;pointer-events:none;z-index:1
  }
  .cell.forced .cap{box-shadow:0 -1px 0 var(--accent)}
  .cell.is-a{border-color:var(--state-a);box-shadow:inset 0 0 0 3px var(--state-a)}
  .cell.is-b{border-color:var(--state-b);box-shadow:inset 0 0 0 3px var(--state-b)}
  .cell.is-a .cell-state{background:var(--state-a);color:#fff}
  .cell.is-b .cell-state{background:var(--state-b);color:#fff}
  .cell.known{filter:saturate(.92)}
  .cell.lit{box-shadow:0 0 0 2px var(--accent), 0 0 22px var(--glow)}
  /* working tags sit in the opposite corner from the result chip so they never collide */
  .tile-tag{position:absolute;top:6px;left:7px;width:14px;height:14px;border-radius:50%;
    box-shadow:0 1px 3px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.5);z-index:2}

  .cell.shake{animation:sh .35s}
  body[data-motion="reduced"] .cell.shake{animation:none;outline:2px solid var(--state-b)}
  body[data-motion="reduced"] .cell:hover{transform:none}
  /* colour-blind mode adds a second, non-colour signal to each state */
  body[data-color-mode="colorblind"] .cell.is-b{border-style:dashed;border-width:2px}
  body[data-color-mode="colorblind"] .cell.is-a{border-style:solid;border-width:2px}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  #status{display:flex;gap:20px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-soft);margin-bottom:8px}
  #status b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:1.2rem;display:block}
  .stat{min-width:56px}
  .stat span{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}

  /* action grid — three across, matching the reference layout */
  #actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:580px;margin:0 0 18px}
  .action{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 10px;
    font-size:.92rem;font-weight:600;border-radius:7px;background:var(--surface-alt);
    border:1px solid var(--line);white-space:nowrap}
  .action:hover{border-color:var(--accent)}
  .action.off{opacity:.4;cursor:default}
  .action.off:hover{border-color:var(--line)}
  .action.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
  .action-icon{font-size:1.05rem;line-height:1}
  @media(max-width:560px){#actions{grid-template-columns:repeat(2,1fr)}}

  /* tutorial */
  .tutorial-card{max-width:420px;text-align:left}
  .tutorial-card h2{text-align:left;margin-bottom:2px}
  .tut-count{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
  .tut-body{font-size:1.05rem;line-height:1.55;margin:0 0 18px;color:var(--ink)}
  .tut-dots{display:flex;gap:7px;margin:0 0 18px}
  .tut-dot{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
  .tut-dot.on{background:var(--accent)}

  /* room presence */
  .player-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.88rem}
  .player-row.stale{opacity:.42}
  .player-row.me .player-name{font-weight:700;color:var(--accent)}
  .player-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .player-name{flex:none;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player-bar{flex:1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
  .player-bar i{display:block;height:100%;transition:width .4s ease}
  .player-count{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--ink-soft);flex:none}
  .player-marks{position:absolute;left:5px;bottom:34px;display:flex;gap:3px;z-index:3}
  .player-marks i{width:15px;height:15px;border-radius:50%;font-style:normal;font-size:9px;
    font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(0,0,0,.5)}

  /* archive */
  .arch-title{font-family:var(--font-display);font-size:1.7rem;margin:0 0 4px}
  .arch-sub{color:var(--ink-soft);font-size:.95rem;margin:0 0 4px;max-width:52ch}
  .arch-count{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--accent);margin:0 0 20px}
  .arch-month{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    margin:22px 0 10px;font-family:var(--font-mono)}
  .arch-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;max-width:520px}
  .arch-pad{display:block}
  .arch-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;padding:0;border-radius:6px;
    background:var(--surface-alt);border:1px solid var(--line)}
  .arch-day:hover{border-color:var(--accent)}
  .arch-day.done{background:color-mix(in srgb, var(--state-a) 26%, var(--surface-alt));
    border-color:var(--state-a)}
  .arch-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .arch-num{font-size:1rem;font-weight:700;line-height:1}
  .arch-pips{display:flex;gap:2px}
  .arch-pips i{width:3px;height:3px;border-radius:50%;background:var(--ink-soft);display:block}
  .arch-score{font-size:.6rem;font-variant-numeric:tabular-nums;color:var(--ink-soft);line-height:1}
  .action.wide{grid-column:1 / -1}

  aside{position:sticky;top:18px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px}
  .clue-head{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);
    margin:12px 0 8px;font-weight:600}
  .clue-head:first-child{margin-top:0}
  .clue{padding:9px 10px;border-left:2px solid var(--accent);background:var(--surface-alt);
    border-radius:0 4px 4px 0;margin-bottom:7px;cursor:pointer;transition:opacity .2s}
  .clue.done{opacity:.35;border-left-color:var(--ink-soft)}
  .clue-text{margin:0;font-size:.97rem;line-height:1.5}
  .clue-src{display:block;margin-top:5px;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .hint-note{font-size:.8rem;color:var(--ink-soft);margin:8px 0 0}

  .lbrow{display:grid;grid-template-columns:22px 1fr auto auto auto;gap:8px;align-items:center;
    padding:7px 0;font-size:.88rem;border-bottom:1px solid var(--line)}
  .lbrow:last-child{border-bottom:0}
  .lbrow.me{color:var(--accent);font-weight:700}
  .wkrow{grid-template-columns:1fr auto auto}
  .lbrank{color:var(--ink-soft);font-size:.76rem}
  .lbtime,.lbscore{font-variant-numeric:tabular-nums;font-size:.85rem}
  .lbscore{font-weight:700}
  .lbperfect{color:var(--accent)}
  .empty{color:var(--ink-soft);font-size:.88rem;margin:5px 0}
  h2.panel-head{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px;color:var(--ink-soft)}

  #players{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .player-count{display:flex;gap:4px;margin-right:8px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:6px;font-size:.92rem;
    transition:opacity .2s,transform .2s;z-index:40;max-width:80vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--state-b);color:#fff}
  .toast.good{background:var(--accent);color:var(--bg)}

  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  #overlay.on{display:flex}
  .result{background:var(--surface-alt);border:1px solid var(--accent);border-radius:8px;padding:28px 34px;text-align:center;max-width:340px}
  .result h2{font-family:var(--font-display);margin:0 0 8px;font-size:26px}
  .result .big{font-size:1.05rem;margin:0 0 4px}
  .result .score{font-size:30px;font-weight:800;margin:6px 0;font-variant-numeric:tabular-nums}
  .result .penalty{color:var(--state-b);font-size:.86rem;margin:0 0 8px;font-weight:600}
  .result .perfect{color:var(--accent);font-size:.88rem;margin:0 0 6px}
  .result .streak{color:var(--ink-soft);font-size:.88rem;margin:0 0 16px}
  .result button{margin:0 4px}
  .result .primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}

  #notice{margin:0 0 12px;padding:10px 14px;border-radius:6px;border:1px solid var(--accent);
    background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--ink);
    font-size:.92rem;line-height:1.45}

  /* ---------- admin ---------- */
  .sheet.admin{width:min(420px,92vw);text-align:left;max-height:86vh;overflow:auto}
  .sheet.admin h3{text-align:center}
  .admin-body{padding:0 22px}
  .admin-head{margin:18px 0 6px;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700}
  .admin-row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.95rem;cursor:pointer}
  .admin-row input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
  .admin-token,.admin-notice{width:100%;box-sizing:border-box;margin:8px 0;padding:10px 12px;
    font:inherit;font-size:.95rem;border:1px solid var(--line);border-radius:6px;
    background:var(--surface);color:var(--ink)}
  .admin-warn{margin:0 0 6px;color:var(--state-b);font-size:.9rem;font-weight:600}
  .admin-save{width:100%;margin:14px 0 4px;padding:12px;font-size:1rem;font-weight:700;
    border:none;border-radius:6px;background:var(--accent);color:var(--bg);cursor:pointer}
  .admin-save:disabled{opacity:.5}

  /* ---------- the tile sheet: one square, opened ---------- */
  .sheet{background:var(--surface-alt);border:1px solid var(--line);border-radius:10px;
    padding:0;text-align:center;width:min(340px,88vw);overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .sheet-art{width:132px;height:132px;margin:22px auto 0;position:relative;overflow:hidden;
    border-radius:6px;border:1px solid var(--tile-line);background:var(--tile)}
  .sheet-art .tile-art{width:100%;height:100%;display:block}
  .sheet h3{font-family:var(--font-display);font-size:1.5rem;margin:14px 0 2px;color:var(--ink)}
  .sheet .sheet-tag{margin:0 0 4px;color:var(--ink-soft);font-size:.95rem}
  .sheet .sheet-note{margin:10px 20px 0;color:var(--ink-soft);font-size:.86rem;line-height:1.45}
  .sheet .sheet-clue{margin:8px 18px 0;padding-left:9px;border-left:2px solid var(--accent);
    text-align:left;font-size:.88rem;line-height:1.45;color:var(--ink)}
  .sheet-choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 20px 18px;
    margin-top:16px;background:color-mix(in srgb, var(--ink) 6%, transparent)}
  .sheet-prompt{flex-basis:100%;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700}
  .sheet-choices button{flex:1;padding:14px 8px;font-size:1rem;font-weight:700;border:none;
    border-radius:6px;color:#fff;cursor:pointer}
  .sheet-choices .pick-a{background:var(--state-a)}
  .sheet-choices .pick-b{background:var(--state-b)}
  .sheet-choices button:disabled{opacity:.38;cursor:not-allowed}
  .sheet-pencils{display:flex;gap:9px;justify-content:center;padding:14px 0 0}
  .sheet-pencils i{width:22px;height:22px;border-radius:50%;cursor:pointer;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 1px 3px rgba(0,0,0,.4)}
  .sheet-pencils i.none{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
  .sheet-pencils i.on{outline:2px solid var(--accent);outline-offset:2px}
  .sheet-close{padding:16px 0 20px}

  /* ---------- per-theme skin flourishes: the artwork carries the rest ---------- */
  .skin-orchard{background-image:repeating-linear-gradient(90deg,rgba(210,96,26,.06) 0 2px,transparent 2px 6px)}
  .skin-orchard .cell{border-radius:3px}

  .skin-record .cell{border-radius:0}
  .skin-record .cap{font-family:var(--font-mono)}
  .skin-record .cell-name{letter-spacing:.12em}
  .skin-record .wrap::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:repeating-linear-gradient(0deg,rgba(95,208,216,.045) 0 1px,transparent 1px 3px)}

  .skin-coldopen .cell{border-radius:2px;box-shadow:0 3px 7px rgba(0,0,0,.35)}
  .skin-coldopen .cell.is-a{box-shadow:0 3px 7px rgba(0,0,0,.35), inset 0 0 0 3px var(--state-a)}
  .skin-coldopen .cell.is-b{box-shadow:0 3px 7px rgba(0,0,0,.35), inset 0 0 0 3px var(--state-b)}
  .skin-coldopen .cell-name{font-family:var(--font-display);font-size:.88rem;letter-spacing:.01em;font-weight:700}

  .skin-callboard .cell{border-radius:1px}
  .skin-callboard .cell-name{letter-spacing:.09em}

  .skin-plate19 #board{gap:4px}
  .skin-plate19 .cell{border-radius:0}
  .skin-plate19 .cell.is-b{box-shadow:inset 0 0 0 3px var(--state-b), inset 0 0 26px var(--glow)}

  .skin-guestlist .cell{border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .skin-guestlist .cell::after{content:"";position:absolute;inset:4px;bottom:calc(25cqh + 4px);
    border:1px solid rgba(217,164,65,.42);pointer-events:none;border-radius:1px}
  .skin-guestlist .cell-name{letter-spacing:.07em}
</style>
</head>
